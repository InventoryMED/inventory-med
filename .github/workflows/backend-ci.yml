name: Validar backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Executar testes
        run: |
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee backend-build.log

      - name: Expor diagnóstico da falha
        if: failure()
        run: |
          diagnostic=$(tail -n 80 backend-build.log)
          diagnostic=${diagnostic//'%'/'%25'}
          diagnostic=${diagnostic//$'\r'/'%0D'}
          diagnostic=${diagnostic//$'\n'/'%0A'}
          echo "::error title=Falha na validação do backend::$diagnostic"
