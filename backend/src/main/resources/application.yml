spring:
  application:
    name: inventory-med-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/core
    user: ${DB_MIGRATION_USERNAME:${spring.datasource.username}}
    password: ${DB_MIGRATION_PASSWORD:${spring.datasource.password}}
  session:
    timeout: ${SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
  jackson:
    default-property-inclusion: non_null

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
    session:
      cookie:
        name: INVENTORYMED_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

inventory:
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    system-admin-email: ${BOOTSTRAP_SYSTEM_ADMIN_EMAIL:admin@inventorymed.local}
    system-admin-password: ${BOOTSTRAP_SYSTEM_ADMIN_PASSWORD:}
  tenancy:
    provisioning:
      enabled: ${TENANT_PROVISIONING_ENABLED:false}
      server-jdbc-url: ${DB_PROVISIONING_URL:${DB_URL}}
      username: ${DB_PROVISIONING_USERNAME:${DB_MIGRATION_USERNAME:${DB_USERNAME}}}
      password: ${DB_PROVISIONING_PASSWORD:${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}}
      credential-encryption-key: ${TENANT_CREDENTIAL_ENCRYPTION_KEY:}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
